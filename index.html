  ::selection { background: ${w.accent}; color: ${w.bg}; }
  button { cursor: pointer; font-family: inherit; transition: filter .15s, background .15s, border-color .15s; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  input, textarea, select { outline: none; }
  input:focus, textarea:focus, select:focus { border-color: ${w.accent} !important; }

  @media (max-width: 620px) { .pw-header { flex-direction: column; align-items: flex-start !important; gap: 16px; } }

    .pw-dirrow > button:last-of-type { grid-column: 2; grid-row: 1; justify-self: end; }
