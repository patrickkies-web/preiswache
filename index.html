12. "url"

  * { box-sizing: border-box; }
  ::selection { background: ${s.accent}; color: ${s.bg}; }
  button { cursor: pointer; font-family: inherit; transition: filter .15s, background .15s, border-color .15s; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  input, textarea, select { outline: none; }
  input:focus, textarea:focus, select:focus { border-color: ${s.accent} !important; }
  select { -webkit-appearance: none; appearance: none; }
  a { color: ${s.accent}; }
  @media (max-width: 620px) { .pw-header { flex-direction: column; align-items: flex-start !important; gap: 16px; } }
  /* Reiterleiste bleibt einzeilig und wird bei Bedarf seitlich geschoben */
  nav::-webkit-scrollbar { display: none; }

  /* Verzeichnis: auf breiten Schirmen eine Tabelle, auf schmalen zwei Zeilen */
  .pw-dirhead, .pw-dirrow {
    display: grid;
    grid-template-columns: minmax(150px, 2.6fr) 92px 96px 98px 72px minmax(84px, 1fr) 104px 28px 32px;
    gap: 9px;
    align-items: center;
  }
  /* Ohne min-width:0 dehnt ein Rasterfeld sich am Inhalt auf, statt ihn zu
     k\xFCrzen \u2014 der Fahrzeugtitel lief dadurch aus seiner Spalte heraus und
     die Reparaturen schoben sich \xFCber den Papierkorb. */
  .pw-dirhead > *, .pw-dirrow > * { min-width: 0; }
  /* Der Titelknopf ist selbst ein Flex-Kasten: ohne overflow am Knopf und
     min-width am inneren Feld schiebt der lange Fahrzeugname die Zeile auf
     und rutscht links aus der Karte heraus. */
  .pw-dirrow > button:first-of-type { width: 100%; max-width: 100%; overflow: hidden; }
  .pw-dirrow > button:first-of-type > span:last-child { flex: 1 1 auto; min-width: 0; overflow: hidden; }
  .pw-metrics { display: contents; }
  /* Quooker-Zeile: eigenes Raster, weil sie einen Knopf weniger hat als
     die Fahrzeugzeile und deren Handy-Regeln sonst den Titel verschieben. */
  .pw-qrow {
    display: grid;
    grid-template-columns: minmax(150px, 2.4fr) 96px 108px 96px 92px 32px;
    gap: 9px;
    align-items: center;
  }
  .pw-qrow > * { min-width: 0; }
  .pw-qrow > button:first-of-type { width: 100%; max-width: 100%; overflow: hidden; }
  .pw-qrow > button:first-of-type > span:last-child { flex: 1 1 auto; min-width: 0; overflow: hidden; }
  /* Auf breiten Schirmen tragen die Spaltenk\xF6pfe die Beschriftung */
  .pw-mlabel { display: none; }
  /* Die Sortierleiste ersetzt auf schmalen Schirmen die Spaltenk\xF6pfe */
  .pw-sortleiste { display: none; }
  @media (max-width: 820px) {
    .pw-dirhead { display: none; }
    .pw-sortselect { display: none !important; }   /* schl\xE4gt den Inline-Stil */
    .pw-sortleiste {
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      padding-bottom: 2px; margin-bottom: 10px;
    }
    .pw-sortleiste::-webkit-scrollbar { display: none; }
    /* Verdachtszeilen brechen um statt zu quetschen */
    .pw-verdacht, .pw-verdacht-neu { grid-template-columns: 1fr 20px !important; row-gap: 2px; }
    .pw-verdacht > span:nth-child(2), .pw-verdacht > span:nth-child(3) { grid-column: 1; text-align: left; }
    .pw-verdacht > span:nth-child(4) { grid-row: 1; grid-column: 2; }
    /* Filterzeilen: Beschriftung \xFCber die Werte statt daneben */
    .pw-filterzeile { grid-template-columns: 1fr !important; gap: 5px !important; }
    /* Merkmalstabelle bricht um, statt seitlich aus dem Bild zu laufen:
       Name \xFCber die volle Breite, darunter die Zahlen. "\xD8 ohne" entf\xE4llt \u2014
       der Abstand daneben sagt dasselbe. */
    .pw-qmerkmal { grid-template-columns: 1fr 1fr 1fr !important; min-width: 0 !important; row-gap: 2px; }
    .pw-qmerkmal > span:nth-child(1) { grid-column: 1 / -1; }
    .pw-qmerkmal > span:nth-child(4) { display: none; }
    .pw-sortleiste > button { flex-shrink: 0; }
    .pw-dirrow { grid-template-columns: minmax(0, 1fr) auto; row-gap: 9px; }
    .pw-qrow { grid-template-columns: minmax(0, 1fr) auto; row-gap: 9px; }
    .pw-qrow > button:first-of-type { grid-column: 1; grid-row: 1; }
    .pw-qrow > button:last-of-type { grid-column: 2; grid-row: 1; justify-self: end; }
    .pw-qrow > .pw-metrics { grid-column: 1 / -1; grid-row: 2; display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .pw-dirrow > button:first-of-type { grid-column: 1; grid-row: 1; }
    .pw-dirrow > button:nth-last-of-type(2) { grid-column: 2; grid-row: 1; justify-self: end; margin-right: 30px; }
    .pw-dirrow > button:last-of-type { grid-column: 2; grid-row: 1; justify-self: end; }
    .pw-metrics { grid-column: 1 / -1; grid-row: 2; display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .pw-mlabel { display: block; }
    /* Sternniveau-Zeilen: Titel oben, Zahlen darunter nebeneinander */
    .pw-karte { grid-template-columns: 84px repeat(auto-fit, minmax(0, 1fr)) !important; gap: 2px !important; }
    .pw-karte > span { font-size: 10px !important; }
    .pw-buch { grid-template-columns: 94px 1fr 44px !important; gap: 6px !important; }
    .pw-buch > span:nth-child(4) { display: none; }
    .pw-stufe { grid-template-columns: auto 1fr !important; row-gap: 2px; }
    .pw-stufe > span:nth-child(1) { grid-area: 1 / 1; }
    .pw-stufe > span:nth-child(4) { grid-area: 1 / 2; text-align: right; }
    .pw-stufe > span:nth-child(2) { grid-area: 2 / 1; }
    .pw-stufe > span:nth-child(3) { grid-area: 2 / 2; text-align: right; }
    .pw-stuetz { grid-template-columns: 1fr auto !important; row-gap: 3px; }
    .pw-stuetz > span:nth-child(5) { grid-column: 1 / -1; text-align: left; }
  }
