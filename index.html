  * { box-sizing: border-box; }
  ::selection { background: ${b.accent}; color: ${b.bg}; }
  button { cursor: pointer; font-family: inherit; transition: filter .15s, background .15s, border-color .15s; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  input, textarea, select { outline: none; }
  input:focus, textarea:focus, select:focus { border-color: ${b.accent} !important; }
  select { -webkit-appearance: none; appearance: none; }
  a { color: ${b.accent}; }
  @media (max-width: 620px) { .pw-header { flex-direction: column; align-items: flex-start !important; gap: 16px; } }
  /* Reiterleiste bleibt einzeilig und wird bei Bedarf seitlich geschoben */
  nav::-webkit-scrollbar { display: none; }

  /* Verzeichnis: auf breiten Schirmen eine Tabelle, auf schmalen zwei Zeilen */
  .pw-dirhead, .pw-dirrow {
    display: grid;
    grid-template-columns: minmax(140px, 2.2fr) 96px 100px 100px 74px minmax(90px, 1.1fr) 96px 28px 32px;
    gap: 9px;
    align-items: center;
  }
  .pw-metrics { display: contents; }
  /* Auf breiten Schirmen tragen die Spaltenk\xF6pfe die Beschriftung */
  .pw-mlabel { display: none; }
  @media (max-width: 820px) {
    .pw-dirhead { display: none; }
    .pw-dirrow { grid-template-columns: 1fr auto; row-gap: 9px; }
    .pw-dirrow > button:first-of-type { grid-column: 1; grid-row: 1; }
    .pw-dirrow > button:nth-last-of-type(2) { grid-column: 2; grid-row: 1; justify-self: end; margin-right: 30px; }
    .pw-dirrow > button:last-of-type { grid-column: 2; grid-row: 1; justify-self: end; }
    .pw-metrics { grid-column: 1 / -1; grid-row: 2; display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .pw-mlabel { display: block; }
    /* Sternniveau-Zeilen: Titel oben, Zahlen darunter nebeneinander */
    .pw-anker { grid-template-columns: 1fr auto !important; row-gap: 4px; }
    .pw-master { grid-template-columns: 26px 1fr auto !important; row-gap: 4px; }
    .pw-master > span:nth-child(2) { grid-column: 2 / -1; }
    .pw-master > span:nth-child(3) { grid-column: 2; }
    .pw-master > span:nth-child(6) { text-align: right; }
    .pw-anker > span:first-child { grid-column: 1 / -1; }
